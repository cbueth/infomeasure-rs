# Cross-package benchmark collection and publishing.
#
# Single workflow on `main` (Option B). Woodpecker reads the config from the
# triggering branch, so this file must NOT be mirrored to `pages`; the `pages`
# branch only carries `registry.json`, the viewer and the data fragments.
#
# Stages (sequential steps in one workflow):
#   checkout     clone `pages` (registry + existing fragments) and the source
#   plan         check upstream versions and decide what this run does
#   sync-pins    expand registry.json into .pins/ for the image build
#   image        build/publish codeberg.org/cbueth/infomeasure-rs:bench (kaniko)
#   collect      run the collectors in :bench, then push fragments to `pages`
#   registry-pr  open a registry-update PR against `pages` (cron only)
#
# Triggers:
#   manual            full collection, publish
#   release tag       full collection, publish
#   cron (bench-*)    registry check -> PR, or collect packages whose pins moved
#   push main .docker rebuild the :bench image only
# Nothing is ever pushed to `main`.
workspace:
  base: /build
  path: .

labels:
  provider: self-hosted
  type: gpu

when:
  - event: manual
  - event: tag
  - event: cron
    branch: main
    cron: bench-*
  - event: push
    branch: main
    path: [.docker/**]

variables:
  - &repo "cbueth/infomeasure-rs"

steps:
  - name: checkout
    image: alpine/git
    environment:
      PAGES_TOKEN:
        from_secret: PAGES_TOKEN
    commands:
      - rm -rf pages src
      - git clone --branch pages "https://oauth2:$PAGES_TOKEN@codeberg.org/cbueth/infomeasure-rs.git" pages
      - |
        REF="main"
        if [ -n "$CI_COMMIT_TAG" ]; then
          REF="$CI_COMMIT_TAG"
        elif [ "$CI_PIPELINE_EVENT" = "manual" ] && [ -n "$CI_COMMIT_BRANCH" ]; then
          REF="$CI_COMMIT_BRANCH"
        fi
      - git clone --depth 1 --branch "$REF" https://codeberg.org/cbueth/infomeasure-rs.git src
      - |
        if [ ! -f src/scripts/bench_packages/run_all.sh ]; then
          echo "ERROR: collector scripts not found on '$REF'."
          exit 1
        fi

  - name: plan
    image: python:3.12-alpine
    commands:
      - apk add --no-cache git >/dev/null 2>&1 || true
      - python3 src/scripts/bench_packages/check_versions.py --registry pages/registry.json --report versions.json --changed-out changed.txt || true
      - BENCH_CRON_BIWEEKLY=1 python3 src/scripts/bench_packages/ci_plan.py | tee plan.env

  - name: sync-pins
    image: python:3.12-alpine
    when:
      - event: [manual, tag, cron]
      - event: push
        branch: main
        path: [.docker/**]
    commands:
      # Build context is the workspace root (the kaniko plugin's default), so
      # stage the Dockerfile dir and the derived pins there.
      - python3 src/scripts/bench_packages/sync_pins.py --registry pages/registry.json --out /build/.pins
      - mkdir -p /build/.docker && cp -r /build/src/.docker/. /build/.docker/

  - name: image
    image: woodpeckerci/plugin-kaniko
    # The :bench image only carries toolchains/packages; the collector source is
    # cloned separately, so a failed/skipped image push must not block a run
    # that can reuse the existing tag.
    failure: ignore
    when:
      - event: [manual, tag, cron]
      - event: push
        branch: main
        path: [.docker/**]
    settings:
      dockerfile: .docker/Dockerfile.bench
      repo: *repo
      registry: codeberg.org
      tags: bench
      username: cbueth
      password:
        from_secret: CODEBERG_PACKAGES_TOKEN
      single-snapshot: true
      # Registry layer cache disabled: Codeberg's registry garbage-collects
      # untagged cache blobs, which leaves kaniko's cache index pointing at
      # missing blobs and the final push fails with BLOB_UNKNOWN. Rebuilds are
      # slower but reliable; re-enable only after recreating the cache repo.
      cache: false

  - name: collect-and-publish
    image: codeberg.org/cbueth/infomeasure-rs:bench
    environment:
      PAGES_TOKEN:
        from_secret: PAGES_TOKEN
    when:
      - event: [manual, tag, cron]
    commands:
      - cd /build
      - . /build/plan.env
      - |
        if [ "$ACTION" != "collect" ]; then
          echo "plan: no collection for this event (ACTION=$ACTION); skipping"
          exit 0
        fi
      - echo "plan ACTION=$ACTION PACKAGES=${PACKAGES:-all} MODE=$MODE"
      - mkdir -p /build/target/bench-data/results
      - cp /build/pages/data/*.json /build/target/bench-data/results/ 2>/dev/null || true
      - cd /build/src
      - BENCH_COMMIT="$(git -C /build/src rev-parse HEAD 2>/dev/null || true)" BENCH_DATA_DIR=/build/target/bench-data BENCH_PACKAGES="$PACKAGES" BENCH_RESUME=1 bash scripts/bench_packages/run_all.sh
      - RESULTS_DIR=/build/target/bench-data/results PAGES_DIR=/build/pages bash scripts/bench_packages/publish_fragments.sh

  - name: registry-pr
    image: python:3.12-alpine
    environment:
      GITEA_TOKEN:
        from_secret: PAGES_TOKEN
    when:
      - event: cron
    commands:
      - apk add --no-cache git >/dev/null 2>&1 || true
      - python3 src/scripts/bench_packages/check_versions.py --registry pages/registry.json --write --report versions.json --changed-out changed.txt || true
      - python3 src/scripts/bench_packages/open_pages_pr.py
