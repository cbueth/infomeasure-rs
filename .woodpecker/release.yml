# Automated release workflow using plugin-ready-release-go
#
# Flow:
# 1. Push to main → Creates Release PR (preparation)
# 2. Release PR merged (with "release" label) → plugin creates tag/release on Codeberg
# 3. cargo publish runs on the merge commit (detected via commit message pattern)

when:
  - event: push
    branch: main

steps:
  - name: release-pr
    image: woodpeckerci/plugin-ready-release-go
    settings:
      git_email: ci@cbueth.de
      forge_token:
        from_secret: FORGE_TOKEN
      forge_type: gitea
      release_prefix: Release

  - name: publish-crates
    image: rust
    environment:
      CARGO_REGISTRY_TOKEN:
        from_secret: crates_io_token
    commands:
      # Guard: only publish when Cargo.toml matches the version being released.
      # The tag version is taken from the release-PR title (merge commit message);
      # beforePrepare must have bumped Cargo.toml to the same version.
      - |
        set -e
        RELEASE_VER=$(printf '%s' "$CI_COMMIT_MESSAGE" | sed -n "s/.*'Release \([^']*\)'.*/\1/p" | head -n1)
        CARGO_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
        [ -n "$RELEASE_VER" ] || { echo "Error: could not parse release version from commit message."; exit 1; }
        [ -n "$CARGO_VER" ] || { echo "Error: could not read version from Cargo.toml."; exit 1; }
        if [ "$RELEASE_VER" != "$CARGO_VER" ]; then
          echo "Error: Cargo.toml version '$CARGO_VER' does not match released version '$RELEASE_VER'."
          echo "Release preparation did not bump Cargo.toml. Uncheck 'Mark this version as a release candidate' in the release PR and re-run before merging."
          exit 1
        fi
        echo "Releasing $CARGO_VER (matches release '$RELEASE_VER')."
      - cargo publish
    when:
      - evaluate: 'CI_COMMIT_MESSAGE matches "^Merge pull request.*Release.*from next-release/main"'
