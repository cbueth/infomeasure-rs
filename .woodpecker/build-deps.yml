# Build the CI toolchain image: Rust + system libs + Python env (no cargo cache)
# Decoupled from Cargo.lock - compiled artifacts live on the runner's volume.

when:
  - branch: main
    event: [manual, cron]
    path: [.docker/Dockerfile, tests/validation_crate/requirements.txt]

matrix:
  RUST: [stable, beta]

variables:
  - &repo "cbueth/infomeasure-rs"

steps:
  - name: build
    image: woodpeckerci/plugin-kaniko
    settings:
      dockerfile: .docker/Dockerfile
      repo: *repo
      registry: codeberg.org
      tags: latest,${RUST}
      username: cbueth
      password:
        from_secret: CODEBERG_PACKAGES_TOKEN
      build_args:
        - RUST=${RUST}
      single-snapshot: true  # exclude source files from final image
