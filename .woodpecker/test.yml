workspace:
  base: /build
  path: .

labels:
  provider: self-hosted
  type: cpu

when:
  - event: [push, pull_request]
    branch: [main, develop]
    path:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
  - event: manual

matrix:
  RUST: [stable, beta]
  FEATURES: [""]  # not testing gpu on CI (no GPU adapter)

steps:
  - name: build
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    environment:
      FEATURES: ${FEATURES}
      RUST: ${RUST}
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - if [ ! -e /target/infomeasure-rs-${RUST}/.seeded ] && [ -d /usr/local/cargo/target ]; then
          mkdir -p /target/infomeasure-rs-${RUST} /target/infomeasure-rs-cargo-${RUST} &&
          cp -an /usr/local/cargo/target/. /target/infomeasure-rs-${RUST}/ &&
          cp -an /usr/local/cargo/. /target/infomeasure-rs-cargo-${RUST}/ &&
          touch /target/infomeasure-rs-${RUST}/.seeded;
        fi
      - if [ -n "${FEATURES}" ]; then
          cargo build -j 4 --workspace --features ${FEATURES};
        else
          cargo build -j 4 --workspace;
        fi

  - name: test
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    environment:
      FEATURES: ${FEATURES}
      RUST: ${RUST}
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - if [ -n "${FEATURES}" ]; then
          cargo test -j 4 --workspace --features ${FEATURES};
        else
          cargo test -j 4 --workspace;
        fi

  - name: doctest
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    environment:
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - cargo test --doc
