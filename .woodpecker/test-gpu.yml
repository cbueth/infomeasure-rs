workspace:
  base: /build
  path: .

labels:
  provider: self-hosted
  type: gpu

when:
  - event: [push, pull_request]
    branch: [main, develop]
    path:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - .docker/**
      - .woodpecker/**
  - event: manual

steps:
  - name: check-gpu
    image: codeberg.org/cbueth/infomeasure-rs:stable
    pull: true
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    commands:
      - . /usr/local/bin/init-nvidia-vulkan.sh
      - vulkaninfo --summary
      - 'if ! vulkaninfo --summary 2>/dev/null | grep -q "PHYSICAL_DEVICE_TYPE_DISCRETE_GPU"; then
          echo "ERROR: no discrete GPU found (only iGPU/software renderer)" >&2;
          exit 1;
        fi'

  - name: build
    image: codeberg.org/cbueth/infomeasure-rs:stable
    pull: true
    environment:
      CARGO_HOME: /target/infomeasure-rs-cargo-gpu
      CARGO_TARGET_DIR: /target/infomeasure-rs-gpu
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - if [ ! -e /target/infomeasure-rs-gpu/.seeded ] && [ -d /usr/local/cargo/target ]; then
          mkdir -p /target/infomeasure-rs-gpu /target/infomeasure-rs-cargo-gpu &&
          cp -an /usr/local/cargo/target/. /target/infomeasure-rs-gpu/ &&
          cp -an /usr/local/cargo/. /target/infomeasure-rs-cargo-gpu/ &&
          touch /target/infomeasure-rs-gpu/.seeded;
        fi
      # `parallel` lets the forced-CPU baseline in the parity tests use all
      # threads; the GPU tier dispatches before `parallel`, so the GPU paths are
      # unchanged (see estimators::gpu gate docs).
      - cargo build -j 8 --workspace --features gpu,parallel

  - name: test
    image: codeberg.org/cbueth/infomeasure-rs:stable
    pull: true
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      CARGO_HOME: /target/infomeasure-rs-cargo-gpu
      CARGO_TARGET_DIR: /target/infomeasure-rs-gpu
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - . /usr/local/bin/init-nvidia-vulkan.sh
      # Filter BEFORE `--`, harness args after it. Putting the filter after a
      # second `--` makes libtest drop the filter and run the FULL suite
      # (incl. CPU tests) — one of which then segfaults.
      #
      # --test-threads 4: the GPU context is a process-wide singleton
      # (`estimators::gpu`), so concurrent cases share one device. Measured on
      # the runner: 1 thread 300 s, 4 threads 91 s, 8 threads 79 s, all rc=0 —
      # the old single-thread restriction (per-test devices) no longer applies.
      - cargo test -j 8 --features gpu,parallel --test all_tests gpu -- --test-threads 4
      - cargo test -j 8 --features gpu,parallel --test all_tests discrete_gpu_batch_matches_cpu -- --ignored --test-threads 1
