# Nightly beta coverage on the VPS. PRs only run stable (see `test.yml`), so
# beta regressions are caught here instead, up to a day before they would reach
# stable. Trigger with a cron job named `test-nightly` on branch `main` (repo
# settings -> Cron). The VPS is the only always-on runner; the GPU box sleeps
# until awoken by a push webhook, so nightly stays on the VPS.
labels:
  provider: self-hosted
  type: cpu

when:
  - event: cron
    cron: test-nightly
  - event: manual

matrix:
  RUST: [beta]
  FEATURES: ["", "parallel"]

steps:
  # Beta lint, kept here (not in `lint.yml`) so PRs stay stable-only.
  - name: clippy
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    environment:
      RUST: ${RUST}
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
    commands:
      - if [ ! -e /target/infomeasure-rs-${RUST}/.seeded ] && [ -d /usr/local/cargo/target ]; then
          mkdir -p /target/infomeasure-rs-${RUST} /target/infomeasure-rs-cargo-${RUST} &&
          cp -an /usr/local/cargo/target/. /target/infomeasure-rs-${RUST}/ &&
          cp -an /usr/local/cargo/. /target/infomeasure-rs-cargo-${RUST}/ &&
          touch /target/infomeasure-rs-${RUST}/.seeded;
        fi
      - cargo clippy --all-targets --all-features -- -D warnings -W clippy::cargo

  - name: build
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    environment:
      FEATURES: ${FEATURES}
      RUST: ${RUST}
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - if [ ! -e /target/infomeasure-rs-${RUST}/.seeded ] && [ -d /usr/local/cargo/target ]; then
          mkdir -p /target/infomeasure-rs-${RUST} /target/infomeasure-rs-cargo-${RUST} &&
          cp -an /usr/local/cargo/target/. /target/infomeasure-rs-${RUST}/ &&
          cp -an /usr/local/cargo/. /target/infomeasure-rs-cargo-${RUST}/ &&
          touch /target/infomeasure-rs-${RUST}/.seeded;
        fi
      - if [ -n "${FEATURES}" ]; then
          cargo build -j 4 --workspace --features ${FEATURES};
        else
          cargo build -j 4 --workspace;
        fi

  - name: test
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    depends_on: [build]
    environment:
      FEATURES: ${FEATURES}
      RUST: ${RUST}
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - if [ -n "${FEATURES}" ]; then
          cargo test -j 4 --workspace --features ${FEATURES};
        else
          cargo test -j 4 --workspace;
        fi

  - name: doctest
    image: codeberg.org/cbueth/infomeasure-rs:${RUST}
    depends_on: [build]
    environment:
      CARGO_HOME: /target/infomeasure-rs-cargo-${RUST}
      CARGO_TARGET_DIR: /target/infomeasure-rs-${RUST}
      CARGO_MANIFEST_DIR: /build/tests/validation_crate
    commands:
      - cargo test --doc
